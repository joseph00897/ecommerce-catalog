<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Modern E-Commerce Store</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

</head>

<body>

  <!-- Header -->

  <header class="header">

    <div class="logo">
      LuxeStore
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

      <a href="categories.html">
        Categories
      </a>

      <a href="cart.html">
       Cart
      </a>

     </nav>

    <!-- Cart -->

    <div class="cart-icon">

      🛒 Cart:
      <span id="cart-count">0</span>

    </div>

  </header>

  <!-- Hero Section -->

  <section class="hero">

    <h1>
      Premium Shopping Experience
    </h1>

    <p>
      Discover modern products with elegant design.
    </p>

  </section>

  <!-- Search -->

  <section class="search-section">

    <input
      type="text"
      id="search-input"
      placeholder="Search products..."
    />

  </section>

  <!-- Products -->

  <main
    id="product-container"
    class="product-grid"
  >

  </main>

  <!-- Footer -->

  <footer>

    <p>
      © 2026 LuxeStore
    </p>

  </footer>

  <script src="js/script.js"></script>

</body>
</html>
